name: ATLAS NFL independent Week 7 player-volume audit (no odds)
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nflverse-week7-volume-crosscheck.py
      - .github/workflows/atlas-nflverse-week7-crosscheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nflverse-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run no-network identity, duplicate and mismatch tests
        run: python3 scripts/proof/nflverse-week7-volume-crosscheck.py --self-test
      - name: Compare ESPNs historical Week 7 volumes against nflverse release
        run: python3 scripts/proof/nflverse-week7-volume-crosscheck.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nflverse-week7-independent-corroboration
          path: atlas-nflverse-week7-corroboration.json
          if-no-files-found: ignore
          retention-days: 7
