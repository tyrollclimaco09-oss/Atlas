name: ATLAS NFL Week 7 real player and PBP evidence (read-only)
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nfl-player-pbp-shadow.mjs
      - scripts/proof/nfl-player-pbp-shadow.test.mjs
      - .github/workflows/atlas-nfl-player-pbp-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nfl-player-pbp:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate per-market stat identities and missing target data
        run: node --test scripts/proof/nfl-player-pbp-shadow.test.mjs
      - name: Fetch one completed Week 7 NFL game without odds
        run: node scripts/proof/nfl-player-pbp-shadow.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-nfl-week7-player-pbp-source-proof
          path: atlas-nfl-week7-pbp-proof.json
          retention-days: 7
          if-no-files-found: error
