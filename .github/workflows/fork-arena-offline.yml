name: ATLAS Fork Arena offline evidence smoke
on:
  push:
    paths:
      - "research/forks/**"
      - ".github/workflows/fork-arena-offline.yml"
  pull_request:
    paths:
      - "research/forks/**"
      - ".github/workflows/fork-arena-offline.yml"
permissions:
  contents: read
jobs:
  pinned-forks-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_NETWORK_MODE: "OFFLINE_TESTS_ONLY"
      ATLAS_EXECUTION_AUTHORITY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact fork revisions (no sportsbook/API calls)
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            "git+https://github.com/tyrollclimaco09-oss/nba_api.git@0c55451abf707ff2e317058d9f417d48b15aebbe" \
            "git+https://github.com/tyrollclimaco09-oss/nflreadpy.git@e7e87b2ef626b8672279db25432b1554ee13348a" \
            "git+https://github.com/tyrollclimaco09-oss/shin.git@ae460853fabeca7d512bbf7de8aaa55dc17f3485"
      - name: Verify installed provenance (no provider read)
        run: |
          python -m pip freeze | grep -E '^(nba_api|nflreadpy|shin) @ git\+' || exit 1
      - name: Run fail-closed offline ATLAS research probes
        run: python -m unittest discover -s research/forks -p 'offline_source_smoke.py' -v
