name: ATLAS NBA archived Q1 player IDs vs live NBA roster
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nba-q1-frozen-player-identity.mjs
      - .github/workflows/atlas-nba-q1-player-identity.yml
permissions: {contents: read}
jobs:
  same-provider-player-roster-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/proof/nba-q1-frozen-player-identity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nba-q1-live-roster-crosscheck
          path: atlas-nba-q1-frozen-player-identity.json
          retention-days: 7
          if-no-files-found: ignore
