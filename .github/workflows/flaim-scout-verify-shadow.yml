name: ATLAS Flaim SCOUT VERIFY shadow
on:
  push:
    paths:
      - 'integrations/flaim/**'
      - 'docs/integrations/FLAIM_SCOUT_VERIFY_SHADOW.md'
      - '.github/workflows/flaim-scout-verify-shadow.yml'
  pull_request:
    paths:
      - 'integrations/flaim/**'
      - 'docs/integrations/FLAIM_SCOUT_VERIFY_SHADOW.md'
      - '.github/workflows/flaim-scout-verify-shadow.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate fantasy-scoped evidence gates
        run: node --test integrations/flaim/*.test.mjs
