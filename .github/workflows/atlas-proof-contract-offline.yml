name: ATLAS prospective proof contract offline
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/freeze-shadow.cjs
      - scripts/proof/freeze-shadow.test.cjs
      - .github/workflows/atlas-proof-contract-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-network-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/proof/freeze-shadow.test.cjs