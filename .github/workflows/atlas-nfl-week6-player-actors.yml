name: ATLAS NFL Week 6 actor-source volume corroboration (no odds)
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nfl-week6-player-actors.py
      - .github/workflows/atlas-nfl-week6-player-actors.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nfl-player-actor-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/proof/nfl-week6-player-actors.py --self-test
      - run: python3 scripts/proof/nfl-week6-player-actors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nfl-week6-actor-volume
          path: atlas-nfl-week6-actor-volume.json
          retention-days: 7
          if-no-files-found: ignore
