name: ATLAS review-only regression proof

on:
  push:
    branches:
      - review/pass0-slate-regression-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-custody:
    name: Original baseline provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 510e22c7a4c9259ec4e1f7b651cd21ac6cb9df9b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original snapshot custody at baseline
        run: node --test command-center/tests/source-preservation.test.cjs

  review-tests:
    name: Review code and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review suite (original snapshot custody verified in separate baseline job)
        shell: bash
        run: |
          mapfile -t files < <(find command-center/tests -maxdepth 1 -name '*.test.cjs' ! -name 'source-preservation.test.cjs' -print | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo "No test files found"; exit 1; fi
          node --test "${files[@]}"
      - name: Verify no execution or deployment workflow in this job
        run: |
          test -f command-center/PASS0_REVIEW_PROVENANCE.json
          node -e "const p=require('./command-center/PASS0_REVIEW_PROVENANCE.json');if(p.status!=='REVIEW_ONLY_NOT_DEPLOYED')process.exit(1)"

  browser-smoke:
    name: Real Chromium archive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        working-directory: command-center/browser-tests
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium runtime
        working-directory: command-center/browser-tests
        run: npx playwright install --with-deps chromium
      - name: Run actual browser tests
        working-directory: command-center/browser-tests
        run: node --test discovery.browser.test.cjs operator-remote.browser.test.cjs

  outcome-shadow:
    name: Offline SCOUT and Outcome Intelligence shadow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline research integrity and scenario settlement checks
        run: node --test scripts/scout/*.test.cjs

  mastersave-proof:
    name: MasterSave source integrity and drift denials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable checkpoint and adversarial drift cases
        run: |
          node --test scripts/continuity/*.test.cjs
          node scripts/continuity/verify-checkpoint.cjs docs/continuity/ATLAS_MASTER_CHECKPOINT_2026-10-18.json
