name: ATLAS NBA independent shot-source identity check (bounded)
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nba-official-shot-crosscheck.mjs
      - scripts/proof/nba-official-shot-crosscheck.test.mjs
      - .github/workflows/atlas-nba-official-shot-crosscheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-secondary-shot-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/proof/nba-official-shot-crosscheck.test.mjs
      - run: node scripts/proof/nba-official-shot-crosscheck.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nba-secondary-pbp-diagnostic
          path: atlas-nba-official-shot-crosscheck.json
          if-no-files-found: ignore
          retention-days: 7
