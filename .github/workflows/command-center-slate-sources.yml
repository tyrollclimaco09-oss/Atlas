name: ATLAS recovered original Command Center slate source wiring
on:
  push:
    paths:
      - "command-center/**"
      - ".github/workflows/command-center-slate-sources.yml"
  pull_request:
    paths:
      - "command-center/**"
      - ".github/workflows/command-center-slate-sources.yml"
permissions:
  contents: read
jobs:
  source-preservation-and-slate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test command-center/tests/*.test.cjs
