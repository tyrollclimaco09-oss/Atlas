name: ATLAS forked SCOUT shadow
on:
  push:
    paths:
      - "integrations/forks/**"
      - "docs/research/ATLAS_FORK_ARSENAL_20261030.md"
      - ".github/workflows/forked-scout-shadow.yml"
  pull_request:
    paths:
      - "integrations/forks/**"
      - "docs/research/ATLAS_FORK_ARSENAL_20261030.md"
      - ".github/workflows/forked-scout-shadow.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: node --test integrations/forks/*.test.mjs
