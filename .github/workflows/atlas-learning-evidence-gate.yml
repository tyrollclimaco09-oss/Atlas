name: ATLAS learning and reference research (offline)
on:
  pull_request:
    paths:
      - 'integrations/learning/**'
      - 'scripts/research/**'
      - 'AGENTS.md'
      - 'PATCH_NOTES.md'
      - 'docs/ATLAS_OFFLINE_REFERENCE_RESEARCH.md'
      - 'docs/research/**'
      - '.github/workflows/atlas-learning-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 Node24 runtime
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require patch notes for implementation changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          base,head=os.environ['BASE_SHA'],os.environ['HEAD_SHA']
          if not all(re.fullmatch(r'[0-9a-f]{40}',s) for s in (base,head)):
              raise SystemExit('Invalid comparison commit')
          paths=subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          implementation=any(p.startswith(('integrations/learning/','scripts/research/','.github/workflows/')) for p in paths)
          if implementation and 'PATCH_NOTES.md' not in paths:
              raise SystemExit('Implementation changes require a dated PATCH_NOTES.md entry')
          print('Patch-note requirement satisfied')
          PY
      - name: Prepare pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6 Node24 runtime
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify learning and market-reference regressions
        run: node --test integrations/learning/*.test.mjs scripts/research/*.test.cjs
      - name: Verify frozen postgame holds and exhaustive outcome stress
        run: |
          printf '{"observations":[]}' | node integrations/learning/score-prospective-nba-cli.mjs > "$RUNNER_TEMP/atlas-postgame-empty.json"
          node integrations/learning/outcome-pattern-check.mjs > "$RUNNER_TEMP/atlas-1024-pattern-stress.json"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          e=json.loads((root/'atlas-postgame-empty.json').read_text())
          s=json.loads((root/'atlas-1024-pattern-stress.json').read_text())
          assert e['contract']=='ATLAS_NBA_PROSPECTIVE_POSTGAME_EVALUATION_V1'
          assert e['held_count']==10 and e['provisional_scored_count']==0
          assert e['paired_metrics'] is None and e['official_calibration_sample_count']==0
          assert not e['production_authority'] and not e['real_betting_authority']
          assert s['contract']=='ATLAS_NBA_OUTCOME_PATTERN_STRESS_V1'
          assert s['patterns_considered']==1024 and s['empirical_sample_count']==0
          assert s['interpreted_probability'] is None
          assert not s['production_authority'] and not s['model_calibration_authority']
          print('Prospective scorer: 10/10 outcomes held until final source evidence')
          print('Exhaustive stress: 1024 hypothetical binary patterns, no observed results or probabilities')
          for key in ('ppg_better_neutral','ppg_worse_neutral','record_better_neutral','record_worse_neutral','ppg_better_record'):
              print(key,s[key])
          PY
      - name: Run seeded scanner simulation and fault sweep
        run: |
          node scripts/research/scanner-simulation.cjs > "$RUNNER_TEMP/atlas-scanner-simulation.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'atlas-scanner-simulation.json').read_text())
          assert r['classification']=='SYNTHETIC_CONDITIONAL_EXPERIMENT'
          assert r['empirical_performance_eligible'] is False
          assert r['network_requests']==0 and r['paper_ledger_mutated'] is False
          assert r['fault_sweep']['checks']==3000 and r['fault_sweep']['failures']==0
          print('Synthetic experiment: 500 events x 250 paths x 8 conditions; 3000 fault/invariance checks passed')
          for s in r['scenarios']:
              print(json.dumps({k:s[k] for k in ('id','signals','mean_estimated_ev','oracle_expected_roi')}))
          PY
