name: ATLAS October 20-21 NBA date-census blind Q3 rate baseline
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nba-oct-date-census.mjs
      - scripts/proof/nba-oct-date-census.test.mjs
      - .github/workflows/atlas-nba-oct-census.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  nba-oct-date-census:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/proof/nba-oct-date-census.test.mjs
      - run: node scripts/proof/nba-oct-date-census.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nba-oct-date-census
          path: atlas-nba-oct2026-q3q4-census.json
          retention-days: 7
          if-no-files-found: ignore
