name: ATLAS NBA preregistered three-game FGA source-quality audit
on:
  push:
    branches: [research/odds-api-probe-2026-10-22]
    paths:
      - scripts/proof/nba-three-game-fga-cohort.mjs
      - scripts/proof/nba-three-game-fga-cohort.test.mjs
      - .github/workflows/atlas-nba-three-game-fga.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nba-sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test scripts/proof/nba-three-game-fga-cohort.test.mjs
      - run: node scripts/proof/nba-three-game-fga-cohort.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-nba-three-game-fga-sanitized
          path: atlas-nba-three-game-fga-cohort.json
          retention-days: 7
          if-no-files-found: ignore
