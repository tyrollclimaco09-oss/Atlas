name: ATLAS Odds API one-credit manual source proof (SHADOW)

# No push, schedule, or automatic retries. Spend is opt-in on manual dispatch.
on:
  workflow_dispatch:
    inputs:
      authorize_one_credit:
        description: "Explicitly authorize at most 1 live-odds quota credit (default is 0)."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: atlas-odds-api-manual-quota-gate
  cancel-in-progress: false

jobs:
  read-only-provider-proof:
    name: NFL h2h / DraftKings source validation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify schema and quota guards with synthetic quotes
        run: python3 scripts/scout/the-odds-api-probe.py --self-test
      - name: Zero-credit dry run unless one credit explicitly authorized
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ATLAS_ODDS_APPROVED_CREDITS: ${{ inputs.authorize_one_credit && '1' || '0' }}
        run: python3 scripts/scout/the-odds-api-probe.py
      - name: Preserve sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-odds-source-proof
          path: atlas-odds-probe-evidence.json
          if-no-files-found: ignore
          retention-days: 7
